name: RSGM CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:

  # =====================================================
  # BACKEND CI - ASP.NET CORE
  # =====================================================

  backend:
    name: Backend Build and Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/RSGM.Api.Tests/RSGM.Api.Tests.csproj

      - name: Build Backend
        run: >
          dotnet build
          backend/RSGM.Api.Tests/RSGM.Api.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run Backend Tests
        run: >
          dotnet test
          backend/RSGM.Api.Tests/RSGM.Api.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal


  # =====================================================
  # FRONTEND CI - REACT
  # =====================================================

  frontend:
    name: Frontend Build and Lint

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RSGM-Frontend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: RSGM-Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend
        run: npm run build


  # =====================================================
  # MOBILE CI - FLUTTER
  # =====================================================

  mobile:
    name: Flutter Analyze and Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RSGM-Mobile

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      - name: Install Mobile Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test


  # =====================================================
  # AGENTIC AI CI - PYTHON
  # =====================================================

  agent-service:
    name: Agentic AI Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent-service

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent-service/requirements.txt

      - name: Show Python Version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Agent Dependencies
        run: pip install -r requirements.txt

      - name: Run Agentic AI Tests
        run: python -m pytest